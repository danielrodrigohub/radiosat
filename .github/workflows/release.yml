name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RadioSAT XP ${{ github.ref_name }}
          body: |
            ## RadioSAT XP ${{ github.ref_name }}
            
            ### Cambios en esta versión
            - Corrige la regresión DTMF de v1.7.5: retira los filtros espectrales añadidos que rechazaban tonos mezclados con audio de programa.
            - Restaura el análisis de frecuencias y el tamaño de ventana de v1.7.4, manteniendo el solapamiento para detectar pausas entre dígitos repetidos.
            - Confirma los dígitos en tres ventanas consecutivas para evitar detecciones transitorias.
            - Conserva la validación exacta del código de conexión y retorno.
            - Añade una prueba PCM que reproduce el rechazo de tonos en v1.7.5 cuando están mezclados con audio más fuerte.
            
            ### Descargas
            | Plataforma | Archivo | Instrucciones |
            |------------|---------|---------------|
            | macOS | `RadioSAT.dmg` | Abrir y arrastrar a Aplicaciones |
            | Windows | `RadioSAT_Setup.exe` | Ejecutar el instalador |
            | Windows Portable | `RadioSAT_Windows.zip` | Descomprimir y ejecutar RadioSAT.exe |
            
            ### Requisitos
            - macOS 12+ o Windows 10+
            - FFmpeg (opcional, para streams remotos)
          draft: false
          prerelease: false

  build-macos:
    name: macOS Build
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller radiosat.spec --clean --noconfirm

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/RadioSAT.app dist/dmg/
          ln -sf /Applications dist/dmg/Applications
          hdiutil create -volname "RadioSAT XP" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            dist/RadioSAT.dmg
          rm -rf dist/dmg

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RadioSAT.dmg
          overwrite_files: true

  build-windows:
    name: Windows Build + Installer
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          Copy-Item ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe .

      - name: Build with PyInstaller
        run: pyinstaller radiosat.spec --clean --noconfirm

      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path "dist\RadioSAT\RadioSAT.exe") {
            echo "RadioSAT.exe built successfully"
            Get-ChildItem dist\RadioSAT | Select-Object Name, Length
          } else {
            echo "ERROR: RadioSAT.exe not found!"
            exit 1
          }

      - name: Create ZIP portable
        shell: pwsh
        run: |
          Compress-Archive -Path dist\RadioSAT\* -DestinationPath dist\RadioSAT_Windows.zip

      - name: Create installer output dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path installer

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            # Fallback: try installing via choco
            choco install innosetup -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Q radiosat.iss
          if (Test-Path "installer\RadioSAT_Setup.exe") {
            echo "Installer created successfully"
            Get-Item "installer\RadioSAT_Setup.exe" | Select-Object Length
          } else {
            echo "ERROR: Installer not created!"
            exit 1
          }

      - name: Upload Windows artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RadioSAT_Windows.zip
            installer/RadioSAT_Setup.exe
          overwrite_files: true
